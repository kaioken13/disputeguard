version: "3.8"

services:
  dispute-guard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disputeguard-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
